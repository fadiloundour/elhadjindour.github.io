<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f1e8">
<title>Seduccess — Administration</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/symbole.svg">
<link rel="preload" href="../assets/fonts/montserrat-400.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="admin.css?v=1">
<script src="../assets/js/config.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="api.js?v=1"></script>
<script src="admin.js?v=1" defer></script>
</head>
<body>

<!-- Écran de connexion -->
<main class="connexion" id="ecran-connexion" hidden>
  <form class="carte-connexion" id="form-connexion" novalidate>
    <img src="../assets/img/symbole.svg" alt="" width="36" height="48">
    <h1>Seduccess<span>Administration</span></h1>
    <p class="aide" id="config-manquante" hidden>Le backend n’est pas encore relié. Renseignez <code>assets/js/config.js</code> (voir <code>backend/GUIDE.md</code>, étape 3).</p>
    <div class="champ"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
    <div class="champ"><label for="mdp">Mot de passe</label><input id="mdp" name="mdp" type="password" autocomplete="current-password" required></div>
    <p class="erreur" id="erreur-connexion" role="alert" hidden></p>
    <button class="btn principal" type="submit">Se connecter</button>
    <button class="btn lien" type="button" id="mdp-oublie">Mot de passe oublié ?</button>
  </form>
</main>

<!-- Application -->
<div class="app" id="app" hidden>
  <aside class="barre" aria-label="Sections">
    <a class="marque" href="#tableau"><img src="../assets/img/symbole.svg" alt="" width="18" height="24"><span>SEDU<span class="c1">C</span><span class="c2">C</span>ESS</span></a>
    <nav class="onglets" id="onglets"></nav>
    <div class="barre-bas">
      <a class="btn lien petit" href="../index.html" target="_blank" rel="noopener">Voir la boutique ↗</a>
      <button class="btn lien petit" type="button" id="deconnexion">Se déconnecter</button>
    </div>
  </aside>
  <div class="contenu">
    <header class="entete">
      <h1 id="titre-section">Tableau de bord</h1>
      <div class="entete-actions" id="actions-section"></div>
    </header>
    <section id="vue" aria-live="polite"></section>
  </div>
</div>

<dialog id="dialogue" aria-labelledby="dialogue-titre">
  <form method="dialog" id="dialogue-form" novalidate>
    <header class="dlg-tete"><h2 id="dialogue-titre"></h2><button class="icone" type="button" data-fermer aria-label="Fermer">✕</button></header>
    <div class="dlg-corps" id="dialogue-corps"></div>
    <p class="erreur" id="dialogue-erreur" role="alert" hidden></p>
    <footer class="dlg-pied" id="dialogue-pied"></footer>
  </form>
</dialog>

<div class="notif" id="notif" role="status" aria-live="polite"></div>
</body>
</html>
